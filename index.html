* {

body {

#game-wrapper {

/* HUD */

/* BOSS */

.boss-hp-bg {

.boss-hp-fill {

const audioCtx =
    new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {

    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'shoot') {

        osc.type = 'square';

        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + .08);

        gain.gain.setValueAtTime(.12, now);
        gain.gain.linearRampToValueAtTime(.01, now + .08);

        osc.start(now);
        osc.stop(now + .08);
    }

    if (type === 'super') {

        osc.type = 'sawtooth';

        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + .25);

        gain.gain.setValueAtTime(.25, now);
        gain.gain.linearRampToValueAtTime(.01, now + .25);

        osc.start(now);
        osc.stop(now + .25);
    }

    if (type === 'powerup') {

        osc.type = 'sine';

        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + .18);

        gain.gain.setValueAtTime(.2, now);
        gain.gain.linearRampToValueAtTime(.01, now + .18);

        osc.start(now);
        osc.stop(now + .18);
    }

    if (type === 'hit') {

        osc.type = 'triangle';

        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(50, now + .05);

        gain.gain.setValueAtTime(.15, now);
        gain.gain.linearRampToValueAtTime(.01, now + .05);

        osc.start(now);
        osc.stop(now + .05);
    }
}

function openBrawlers() {

    startScreen.classList.add('hidden');
    brawlerScreen.classList.remove('hidden');

    renderBrawlerGrid();
}


function closeBrawlers() {

    brawlerScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
}


function renderBrawlerGrid() {

    const grid =
        document.getElementById('brawler-grid');

    grid.innerHTML = '';

    BRAWLERS.forEach(b => {

        const card =
            document.createElement('div');

        card.className =
            'brawler-card ' +
            (b.id === selectedBrawler.id
                ? 'selected'
                : '');

        card.onclick = () =>
            selectBrawler(b);

        card.innerHTML = `

            <div class="brawler-icon">
                ${b.icon}
            </div>

            <div class="brawler-name">
                ${b.name}
            </div>

            <div class="brawler-role">
                ${b.role}
            </div>
        `;

        grid.appendChild(card);
    });

    updateBrawlerInfo();
}


function selectBrawler(b) {

    selectedBrawler = b;

    document.getElementById('menu-avatar').innerText =
        b.icon;

    document.getElementById('menu-brawler-name').innerText =
        b.name;

    document.getElementById('menu-brawler-role').innerText =
        b.role;

    document.getElementById('hud-avatar').innerText =
        b.icon;

    document.getElementById('hud-brawler-name').innerText =
        b.name;

    renderBrawlerGrid();
    updateBrawlerInfo();

/* =========================
   MIRA
========================= */

function updateMousePosition(clientX, clientY) {

    const rect = canvas.getBoundingClientRect();

    mouse.x =
        (clientX - rect.left) *
        (canvas.width / rect.width);

    mouse.y =
        (clientY - rect.top) *
        (canvas.height / rect.height);
}


function clampAimPoint(x, y) {

    return {
        x: Math.max(30, Math.min(canvas.width - 30, x)),
        y: Math.max(30, Math.min(canvas.height - 30, y))
    };
}


function setSuperAimFromPointer(clientX, clientY) {

    updateMousePosition(clientX, clientY);

    const point = clampAimPoint(mouse.x, mouse.y);

    superAimPoint.x = point.x;
    superAimPoint.y = point.y;

    showSuperAimPreview();
}


function showSuperAimPreview() {

    if (!superAiming) return;

    const rect = canvas.getBoundingClientRect();

    superAimPreview.style.display = 'block';
    superAimPreview.style.left =
        (superAimPoint.x / canvas.width * rect.width) + 'px';
    superAimPreview.style.top =
        (superAimPoint.y / canvas.height * rect.height) + 'px';
}


function hideSuperAimPreview() {

    superAimPreview.style.display = 'none';
}


function startSuperAim(pointerId, clientX, clientY, isTouch = false) {

    if (!gameRunning) return;
    if (player.superCharge < 100) return;

    superAiming = true;
    superPointerId = pointerId;

    setSuperAimFromPointer(clientX, clientY);

    if (isTouch) {
        superTouch.classList.add('aiming');
    }
}


function finishSuperAim() {

    if (!superAiming) return;

    superAiming = false;
    superPointerId = null;

    superTouch.classList.remove('aiming');
    hideSuperAimPreview();

    if (gameRunning && player.superCharge >= 100) {
        useSuper(superAimPoint.x, superAimPoint.y);
    }
}


/* =========================
   MOUSE
========================= */

canvas.addEventListener('pointermove', e => {

    updateMousePosition(e.clientX, e.clientY);

    if (
        superAiming &&
        superPointerId === e.pointerId
    ) {
        setSuperAimFromPointer(e.clientX, e.clientY);
    }
});


/* ESQUERDO = ATAQUE / DIREITO = SEGURAR PARA MIRAR SUPER */
canvas.addEventListener('pointerdown', e => {

    if (!gameRunning) return;

    updateMousePosition(e.clientX, e.clientY);

    if (e.pointerType === 'mouse' && e.button === 0) {
        e.preventDefault();
        fireBrawlerWeapon();
        return;
    }

    if (e.pointerType === 'mouse' && e.button === 2) {
        e.preventDefault();
        e.stopPropagation();
        startSuperAim(e.pointerId, e.clientX, e.clientY, false);
    }
});


window.addEventListener('pointerup', e => {

    if (superAiming && superPointerId === e.pointerId) {
        finishSuperAim();
    }

    if (joystickActive && joystickPointerId === e.pointerId) {
        joystickActive = false;
        joystickPointerId = null;
        mobileMove.x = 0;
        mobileMove.y = 0;
        joystickKnob.style.left = '50%';
        joystickKnob.style.top = '50%';
    }
});


/* Nunca abre o menu do botão direito durante o jogo. */
canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    e.stopPropagation();
});


/* =========================
   JOYSTICK MOBILE
========================= */

function updateJoystick(clientX, clientY) {

    const rect = joystick.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;

    const max = 46;
    const distance = Math.hypot(dx, dy);

    if (distance > max) {
        dx = dx / distance * max;
        dy = dy / distance * max;
    }

    mobileMove.x = dx / max;
    mobileMove.y = dy / max;

    joystickKnob.style.left =
        `calc(50% + ${dx}px)`;

    joystickKnob.style.top =
        `calc(50% + ${dy}px)`;
}


joystick.addEventListener('pointerdown', e => {

    if (!gameRunning) return;

    e.preventDefault();
    e.stopPropagation();

    joystickActive = true;
    joystickPointerId = e.pointerId;

    joystick.setPointerCapture(e.pointerId);
    updateJoystick(e.clientX, e.clientY);
});


joystick.addEventListener('pointermove', e => {

    if (!joystickActive || joystickPointerId !== e.pointerId) return;

    e.preventDefault();
    updateJoystick(e.clientX, e.clientY);
});


/* =========================
   SUPER MOBILE
========================= */

superTouch.addEventListener('pointerdown', e => {

    if (!gameRunning) return;

    e.preventDefault();
    e.stopPropagation();

    if (player.superCharge < 100) return;

    superTouch.setPointerCapture(e.pointerId);

    startSuperAim(
        e.pointerId,
        e.clientX,
        e.clientY,
        true
    );
});


superTouch.addEventListener('pointermove', e => {

    if (!superAiming || superPointerId !== e.pointerId) return;

    e.preventDefault();
    setSuperAimFromPointer(e.clientX, e.clientY);
});


superTouch.addEventListener('pointerup', e => {

    if (!superAiming || superPointerId !== e.pointerId) return;

    e.preventDefault();
    finishSuperAim();
});


/* Touch pode mirar no campo enquanto o SUPER está pressionado. */
canvas.addEventListener('pointermove', e => {

    if (
        e.pointerType !== 'mouse' &&
        superAiming &&
        superPointerId === e.pointerId
    ) {
        setSuperAimFromPointer(e.clientX, e.clientY);
    }
});


/* =========================
   SUPER
========================= */

function useSuper(targetX = mouse.x, targetY = mouse.y) {

    if (!gameRunning) return;
    if (player.superCharge < 100) return;

    const target = clampAimPoint(targetX, targetY);

    player.superCharge = 0;
    updateSuperHUD();
    playSound('super');
    screenShake = 15;

    const angle = Math.atan2(
        target.y - player.y,
        target.x - player.x
    );


    /* SHELLY */
    if (selectedBrawler.id === 'shelly') {

        const count = 14;

        for (let i = 0; i < count; i++) {

            const a = angle +
                (i - (count - 1) / 2) * .13;

            bullets.push({
                x:player.x,
                y:player.y,
                vx:Math.cos(a) * 15,
                vy:Math.sin(a) * 15,
                radius:10,
                damage:70,
                color:'#facc15',
                superType:'shelly',
                life:55
            });
        }

        breakObstaclesInArea(player.x, player.y, 180);
        pushEnemies(player.x, player.y, 190, 9);
        return;
    }


    /* COLT */
    if (selectedBrawler.id === 'colt') {

        for (let i = 0; i < 12; i++) {

            setTimeout(() => {

                if (!gameRunning) return;

                bullets.push({
                    x:player.x,
                    y:player.y,
                    vx:Math.cos(angle) * 18,
                    vy:Math.sin(angle) * 18,
                    radius:7,
                    damage:42,
                    color:'#38bdf8',
                    superType:'colt',
                    life:120
                });

            }, i * 45);
        }

        breakObstaclesLine(player.x, player.y, angle, 800);
        return;
    }


    /* BULL - VAI EXATAMENTE PARA O PONTO MIRADO */
    if (selectedBrawler.id === 'bull') {

        player.dash = {
            startX:player.x,
            startY:player.y,
            targetX:target.x,
            targetY:target.y,
            time:24,
            maxTime:24
        };

        return;
    }


    /* BROCK - CHUVA CONCENTRADA NO PONTO MIRADO */
    if (selectedBrawler.id === 'brock') {

        for (let i = 0; i < 10; i++) {

            const spread = 80;
            const x = target.x + (Math.random() - .5) * spread;
            const y = target.y + (Math.random() - .5) * spread;

            setTimeout(() => {

                if (!gameRunning) return;

                createExplosion(
                    Math.max(30, Math.min(canvas.width - 30, x)),
                    Math.max(30, Math.min(canvas.height - 30, y)),
                    72,
                    100
                );

                createFireZone(
                    Math.max(30, Math.min(canvas.width - 30, x)),
                    Math.max(30, Math.min(canvas.height - 30, y))
                );

            }, i * 120);
        }

        return;
    }


    /* EL PRIMO - SALTA PARA O PONTO MIRADO */
    if (selectedBrawler.id === 'elprimo') {

        player.jump = {
            startX:player.x,
            startY:player.y,
            targetX:target.x,
            targetY:target.y,
            time:35,
            maxTime:35
        };

        return;
    }


    /* POCO */
    if (selectedBrawler.id === 'poco') {

        player.hp = player.maxHp;

        createHealEffect(player.x, player.y, 120);
        return;
    }


    /* PIPER */
    if (selectedBrawler.id === 'piper') {

        const oldX = player.x;
        const oldY = player.y;

        player.x = Math.max(
            30,
            Math.min(canvas.width - 30,
                player.x - Math.cos(angle) * 150)
        );

        player.y = Math.max(
            30,
            Math.min(canvas.height - 30,
                player.y - Math.sin(angle) * 150)
        );

        for (let i = 0; i < 4; i++) {

            const bombAngle = Math.PI * 2 * i / 4;

            bombs.push({
                x:oldX + Math.cos(bombAngle) * 45,
                y:oldY + Math.sin(bombAngle) * 45,
                timer:120,
                radius:14
            });
        }

        createExplosion(oldX, oldY, 35, 0);
        return;
    }


    /* MORTIS */
    if (selectedBrawler.id === 'mortis') {

        for (let i = 0; i < 10; i++) {

            const a = angle + (i - 4.5) * .13;

            bullets.push({
                x:player.x,
                y:player.y,
                vx:Math.cos(a) * 11,
                vy:Math.sin(a) * 11,
                radius:9,
                damage:45,
                color:'#c084fc',
                superType:'mortis',
                life:90
            });
        }

        return;
    }


    /* SPIKE - CAMPO EXATAMENTE NO PONTO MIRADO */
    if (selectedBrawler.id === 'spike') {

        spikeAreas.push({
            x:target.x,
            y:target.y,
            radius:90,
            time:480
        });

        screenShake = 10;
        return;
    }


    /* CROW */
    if (selectedBrawler.id === 'crow') {

        createCrowDaggers(player.x, player.y);

        const distance = Math.min(
            160,
            Math.hypot(target.x - player.x, target.y - player.y)
        );

        player.x = Math.max(
            30,
            Math.min(canvas.width - 30,
                player.x + Math.cos(angle) * distance)
        );

        player.y = Math.max(
            30,
            Math.min(canvas.height - 30,
                player.y + Math.sin(angle) * distance)
        );

        createCrowDaggers(player.x, player.y);
        return;
    }
}


/* =========================
   TIRO NORMAL
========================= */

function fireBrawlerWeapon() {

    if (player.ammo < 1) return;

    player.ammo--;

    updateAmmoHUD();

    playSound('shoot');

    const baseAngle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );

    const damageMult =
        player.activePowers.doubleDamage ? 2 : 1;

    const isQuad =
        player.activePowers.quad;


    /* COLT */

    if (selectedBrawler.id === 'colt') {

        const count = isQuad ? 8 : 4;

        for (let i = 0; i < count; i++) {

            setTimeout(() => {

                if (!gameRunning) return;

                bullets.push({

                    x:player.x,
                    y:player.y,

                    vx:Math.cos(baseAngle) * 15,
                    vy:Math.sin(baseAngle) * 15,

                    radius:5,

                    damage:
                        selectedBrawler.damage *
                        damageMult,

                    color:'#38bdf8',

                    life:100
                });

            }, i * 55);
        }

        return;
    }


    /* SHELLY */

    if (selectedBrawler.id === 'shelly') {

        const count = isQuad ? 10 : 5;

        for (let i = 0; i < count; i++) {

            const angle =
                baseAngle +
                (i - (count - 1) / 2) * .14;

            bullets.push({

                x:player.x,
                y:player.y,

                vx:Math.cos(angle) * 12,
                vy:Math.sin(angle) * 12,

                radius:6,

                damage:
                    selectedBrawler.damage *
                    damageMult,

                color:'#eab308',

                life:50
            });
        }

        return;
    }


    /* BULL - ESCOPETA DE DOIS CANOS */

    if (selectedBrawler.id === 'bull') {

        const count = isQuad ? 12 : 8;

        for (let i = 0; i < count; i++) {

            const angle =
                baseAngle +
                (i - (count - 1) / 2) * .075;

            bullets.push({

                x:player.x + Math.cos(angle) * 18,
                y:player.y + Math.sin(angle) * 18,

                vx:Math.cos(angle) * 13,
                vy:Math.sin(angle) * 13,

                radius:8,

                damage:
                    selectedBrawler.damage *
                    damageMult *
                    1.15,

                color:'#fb923c',

                life:55,

                bullPellet:true

            });

        }

        particles.push({
            type:'muzzle',
            x:player.x + Math.cos(baseAngle) * 32,
            y:player.y + Math.sin(baseAngle) * 32,
            angle:baseAngle,
            life:10,
            maxLife:10
        });

        return;
    }


    /* POCO */

    if (selectedBrawler.id === 'poco') {

        const count = isQuad ? 10 : 6;

        for (let i = 0; i < count; i++) {

            const angle =
                baseAngle +
                (i - (count - 1) / 2) * .12;

            bullets.push({

                x:player.x,
                y:player.y,

                vx:Math.cos(angle) * 10,
                vy:Math.sin(angle) * 10,

                radius:7,

                damage:
                    selectedBrawler.damage *
                    damageMult,

                color:'#facc15',

                life:60
            });
        }

        return;
    }


    /* BROCK - FOGUETE GRANDE */

    if (selectedBrawler.id === 'brock') {

        bullets.push({

            x:player.x,
            y:player.y,

            vx:Math.cos(baseAngle) * 10,
            vy:Math.sin(baseAngle) * 10,

            radius:14,

            damage:
                selectedBrawler.damage *
                damageMult,

            color:'#f97316',

            life:90,

            type:'brockRocket',

            rocketAngle:baseAngle

        });

        particles.push({
            type:'rocketLaunch',
            x:player.x,
            y:player.y,
            angle:baseAngle,
            life:18,
            maxLife:18
        });

        return;
    }


    /* SPIKE - CACTO QUE EXPLODE */

    if (selectedBrawler.id === 'spike') {

        spikeAreas.push({

            x:Math.max(
                60,
                Math.min(
                    canvas.width - 60,
                    mouse.x
                )
            ),

            y:Math.max(
                60,
                Math.min(
                    canvas.height - 60,
                    mouse.y
                )
            ),

            radius:90,

            time:480

        });

        screenShake = 10;

        return;
    }


    /* =====================
       CROW
    ===================== */

    if (selectedBrawler.id === 'crow') {

        createCrowDaggers(
            player.x,
            player.y
        );

        const distance = 160;

        player.x =
            Math.max(
                30,
                Math.min(
                    canvas.width - 30,
                    player.x +
                    Math.cos(angle) *
                    distance
                )
            );

        player.y =
            Math.max(
                30,
                Math.min(
                    canvas.height - 30,
                    player.y +
                    Math.sin(angle) *
                    distance
                )
            );

        createCrowDaggers(
            player.x,
            player.y
        );

        return;
    }
}

        radius:8,

/* =========================
   FOGO DO BROCK
========================= */

function createFireZone(x, y) {

    fireZones.push({

        x:x,
        y:y,

        radius:42,

        time:480,

        maxTime:480,

        damageTimer:0

    });

    particles.push({

        type:'fireStart',

        x:x,
        y:y,

        radius:12,

        maxRadius:42,

        life:30,

        maxLife:30

    });

}


function updateFireZones() {

    for (let i = fireZones.length - 1; i >= 0; i--) {

        const fire = fireZones[i];

        fire.time--;

        fire.damageTimer--;

        if (fire.damageTimer <= 0) {

            fire.damageTimer = 12;

            enemies.forEach(e => {

                const dist =
                    Math.hypot(
                        e.x - fire.x,
                        e.y - fire.y
                    );

                if (dist <
                    fire.radius + e.radius) {

                    e.hp -= 7;

                }

            });

        }

        if (fire.time <= 0) {

            fireZones.splice(i,1);

        }

    }

}


/* =========================
   EXPLOSÃO
========================= */

function createExplosion(x, y, radius, damage) {

    particles.push({

        type:'explosion',

        x:x,
        y:y,

        radius:5,

        maxRadius:radius,

        life:25,

        maxLife:25

    });


    enemies.forEach(e => {

        const dist =
            Math.hypot(
                e.x - x,
                e.y - y
            );

        if (dist < radius + e.radius) {

            const falloff =
                Math.max(
                    .25,
                    1 - dist / radius
                );

            e.hp -= damage * falloff;

            pushEnemy(
                e,
                x,
                y,
                8
            );

        }

    });


    breakObstaclesInArea(
        x,
        y,
        radius
    );

    screenShake = 12;
}


/* =========================
   CURA POCO
========================= */

/* =========================
   CROW
========================= */

function createCrowDaggers(x,y) {

    for (let i = 0; i < 12; i++) {

        const angle =
            Math.PI * 2 * i / 12;

        bullets.push({

            x:x,
            y:y,

            vx:Math.cos(angle) * 12,
            vy:Math.sin(angle) * 12,

            radius:6,

            damage:40,

    });

}


/* =========================
   EMPURRAR INIMIGOS
========================= */

function pushEnemy(e, x, y, force) {

    const angle =
        Math.atan2(
            e.y - y,
            e.x - x
        );

    e.x += Math.cos(angle) * force;
    e.y += Math.sin(angle) * force;
}


function pushEnemies(x,y,radius,force) {

    enemies.forEach(e => {

        const dist =
            Math.hypot(
                e.x - x,
                e.y - y
            );

        if (dist < radius) {

            pushEnemy(
                e,
                x,
                y,
                force
            );

        }

    });

}


/* =========================
   OBSTÁCULOS
========================= */

function breakObstaclesInArea(x,y,radius) {

    obstacles.forEach(o => {

        const centerX = o.x + o.w / 2;
        const centerY = o.y + o.h / 2;

        const dist =
            Math.hypot(
                centerX - x,
                centerY - y
            );

        if (dist < radius + 70) {
            o.hp = 0;
        }

    });

}


function breakObstaclesLine(x,y,angle,distance) {

    obstacles.forEach(o => {

        const centerX = o.x + o.w / 2;
        const centerY = o.y + o.h / 2;

        const dx = centerX - x;
        const dy = centerY - y;

        const forward =
            dx * Math.cos(angle) +
            dy * Math.sin(angle);

        if (forward > 0 && forward < distance) {

            const side =
                Math.abs(
                    -Math.sin(angle) * dx +
                    Math.cos(angle) * dy
                );

            if (side < 70) {
                o.hp = 0;
            }

        }

    });

}


/* =========================
   INIMIGOS
========================= */

function spawnEnemy() {

    const speedBonus =
        Math.min(1.8, score / 3000);


    if (
        kills > 0 &&
        kills % 10 === 0 &&
        !activeBoss
    ) {

        activeBoss = {

            x:canvas.width / 2,
            y:-50,

            radius:36,

            speed:1.4,

            hp:800,
            maxHp:800,

            isBoss:true

        };

        enemies.push(activeBoss);

        bossBanner.classList.remove('hidden');

        screenShake = 20;
    }


    if (
        Math.random() <
        (.025 + score / 50000) &&
        enemies.length < 10
    ) {

        const isTank =
            Math.random() < .3;

        const spawnX =
            Math.random() < .5
                ? -30
                : canvas.width + 30;

        const spawnY =
            Math.random() * canvas.height;

        enemies.push({

            x:spawnX,
            y:spawnY,

            radius:
                isTank ? 22 : 16,

            speed:
                (isTank ? 1.3 : 2.2) +
                speedBonus,

            hp:
                isTank ? 150 : 60,

            maxHp:
                isTank ? 150 : 60,

            type:
                isTank ? 'tank' : 'runner',

            isBoss:false

        });

}

/* =========================
   UPDATE
========================= */

function update() {

    if (!gameRunning) return;


    /* VELOCIDADE */

    let currentSpeed =
        selectedBrawler.speed;

    if (player.activePowers.speed) {
        currentSpeed *= 1.4;
    }


    /* MUNIÇÃO */

    const rechargeRate =
        player.activePowers.speed
            ? .05
            : .028;

    if (player.ammo < player.maxAmmo) {

        player.ammoRecharge += rechargeRate;

        if (player.ammoRecharge >= 1) {

            player.ammo++;

            player.ammoRecharge = 0;

            updateAmmoHUD();

        }

    }


    /* PODERES */

    activePowersDiv.innerHTML = '';

    Object.keys(player.activePowers).forEach(p => {

        player.activePowers[p]--;

        if (player.activePowers[p] <= 0) {

            delete player.activePowers[p];

        } else {

            const tag =
                document.createElement('div');

            tag.className = 'power-tag';

            tag.innerText =
                `${p.toUpperCase()} (${Math.ceil(
                    player.activePowers[p] / 60
                )}s)`;

            activePowersDiv.appendChild(tag);

        }

    });


    /* MOVIMENTO */

    let moveX = 0;
    let moveY = 0;

    if (keys['KeyA'] || keys['ArrowLeft']) moveX--;
    if (keys['KeyD'] || keys['ArrowRight']) moveX++;
    if (keys['KeyW'] || keys['ArrowUp']) moveY--;
    if (keys['KeyS'] || keys['ArrowDown']) moveY++;

    if (mobileMove.x !== 0 || mobileMove.y !== 0) {
        moveX = mobileMove.x;
        moveY = mobileMove.y;
    }

    if (moveX !== 0 && moveY !== 0) {

        moveX *= .7071;
        moveY *= .7071;

    }


    player.x += moveX * currentSpeed;
    player.y += moveY * currentSpeed;

    player.x =
        Math.max(
            25,
            Math.min(
                canvas.width - 25,
                player.x
            )
        );

    player.y =
        Math.max(
            25,
            Math.min(
                canvas.height - 25,
                player.y
            )
        );


    /* BULL DASH */

    if (player.dash) {

        const d = player.dash;

        const progress =
            1 -
            d.time / d.maxTime;

        player.x =
            d.startX +
            (d.targetX - d.startX) *
            progress;

        player.y =
            d.startY +
            (d.targetY - d.startY) *
            progress;

        d.time--;

        pushEnemies(
            player.x,
            player.y,
            58,
            14
        );

        breakObstaclesInArea(
            player.x,
            player.y,
            50
        );

        if (d.time <= 0) {

            /*
               GARANTE QUE O BULL TERMINE
               EXATAMENTE NO CLIQUE.
            */

            player.x = d.targetX;
            player.y = d.targetY;

            createExplosion(
                player.x,
                player.y,
                82,
                115
            );

            pushEnemies(
                player.x,
                player.y,
                105,
                18
            );

            breakObstaclesInArea(
                player.x,
                player.y,
                105
            );

            particles.push({

                type:'bullImpact',

                x:player.x,
                y:player.y,

                radius:12,

                maxRadius:82,

                life:24,

                maxLife:24

            });

            screenShake = 22;

            player.dash = null;

        }

    }


    /* EL PRIMO JUMP */

    if (player.jump) {

        const j = player.jump;

        const progress =
            1 -
            j.time / j.maxTime;

        player.x =
            j.startX +
            (j.targetX - j.startX) *
            progress;

        player.y =
            j.startY +
            (j.targetY - j.startY) *
            progress;

        j.time--;

        if (j.time <= 0) {

            createExplosion(
                player.x,
                player.y,
                100,
                90
            );

            pushEnemies(
                player.x,
                player.y,
                120,
                12
            );

            breakObstaclesInArea(
                player.x,
                player.y,
                120
            );

            player.jump = null;

        }

    }


    /* TIROS */

    for (let i = bullets.length - 1; i >= 0; i--) {

        const b = bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        if (b.life !== undefined) {

            b.life--;

            if (b.life <= 0) {

                if (b.type === 'brockRocket') {

                    createExplosion(
                        b.x,
                        b.y,
                        65,
                        b.damage
                    );

                    createFireZone(
                        Math.max(30, Math.min(canvas.width - 30, b.x)),
                        Math.max(30, Math.min(canvas.height - 30, b.y))
                    );

                }

                if (b.type === 'spikeCactus') {

                    explodeSpike(
                        b.x,
                        b.y,
                        b.damage
                    );

                }

                bullets.splice(i,1);
                continue;

            }

        }


        if (
            b.x < -30 ||
            b.x > canvas.width + 30 ||
            b.y < -30 ||
            b.y > canvas.height + 30
        ) {

            if (b.type === 'brockRocket') {

                createExplosion(
                    Math.max(30, Math.min(canvas.width - 30, b.x)),
                    Math.max(30, Math.min(canvas.height - 30, b.y)),
                    65,
                    b.damage
                );

                createFireZone(
                    Math.max(30, Math.min(canvas.width - 30, b.x)),
                    Math.max(30, Math.min(canvas.height - 30, b.y))
                );

            }

            if (b.type === 'spikeCactus') {

                explodeSpike(
                    Math.max(30, Math.min(canvas.width - 30, b.x)),
                    Math.max(30, Math.min(canvas.height - 30, b.y)),
                    b.damage
                );

            }

            bullets.splice(i,1);
            continue;

        }


        /* TIRO CONTRA OBSTÁCULO */

        let hitObstacle = false;

        for (let o of obstacles) {

            if (
                b.x > o.x &&
                b.x < o.x + o.w &&
                b.y > o.y &&
                b.y < o.y + o.h
            ) {

                if (b.superType) {

                    o.hp = 0;

                } else {

                    o.hp -= b.damage;

                }

                if (b.type === 'brockRocket') {

                    o.hp = 0;

                    createExplosion(
                        b.x,
                        b.y,
                        65,
                        b.damage
                    );

                    createFireZone(
                        b.x,
                        b.y
                    );

                }

                if (b.type === 'spikeCactus') {

                    o.hp = 0;

                    explodeSpike(
                        b.x,
                        b.y,
                        b.damage
                    );

                }

                hitObstacle = true;

                if (!b.superType) {
                    bullets.splice(i,1);
                }

                break;

            }

        }

        if (hitObstacle) continue;

    }


    /* LIMPA OBSTÁCULOS */

    obstacles =
        obstacles.filter(o => o.hp > 0);


    /* INIMIGOS */

    spawnEnemy();


    for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {

        const e = enemies[eIdx];


        /* FOGO DO BROCK */

        fireZones.forEach(fire => {

            const fireDist =
                Math.hypot(
                    e.x - fire.x,
                    e.y - fire.y
                );

            if (
                fireDist <
                fire.radius + e.radius
            ) {

                e.hp -= .15;

            }

        });


        /* SPIKE AREA */

        let slow = 1;

        spikeAreas.forEach(area => {

            const dist =
                Math.hypot(
                    e.x - area.x,
                    e.y - area.y
                );

            if (dist < area.radius) {

                slow = .45;

                e.hp -= .5;

            }

        });


        const angle =
            Math.atan2(
                player.y - e.y,
                player.x - e.x
            );

        e.x += Math.cos(angle) * e.speed * slow;
        e.y += Math.sin(angle) * e.speed * slow;


        /* PLAYER */

        const distPlayer =
            Math.hypot(
                player.x - e.x,
                player.y - e.y
            );

        if (
            distPlayer <
            player.radius + e.radius
        ) {

            if (!player.activePowers.shield) {

                player.hp -=
                    e.isBoss ? 1.2 : .5;

                if (player.hp <= 0) {

                    gameOver();
                    return;

                }

            }

        }


        /* TIROS X INIMIGO */

        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {

            const b = bullets[bIdx];

            const distBullet =
                Math.hypot(
                    b.x - e.x,
                    b.y - e.y
                );

            if (
                distBullet <
                b.radius + e.radius
            ) {

                e.hp -= b.damage;

                if (
                    b.type === 'brockRocket'
                ) {

                    createExplosion(
                        b.x,
                        b.y,
                        68,
                        b.damage
                    );

                    createFireZone(
                        b.x,
                        b.y
                    );

                    bullets.splice(
                        bIdx,
                        1
                    );

                }

                else if (
                    b.type === 'spikeCactus'
                ) {

                    explodeSpike(
                        b.x,
                        b.y,
                        b.damage
                    );

                    bullets.splice(
                        bIdx,
                        1
                    );

                }

                else {

                    bullets.splice(
                        bIdx,
                        1
                    );

                }

                playSound('hit');

                player.superCharge =
                    Math.min(
                        100,
                        player.superCharge + 7
                    );

                updateSuperHUD();


                /* MORTIS CURA */

                if (
                    b.superType === 'mortis'
                ) {

                    player.hp =
                        Math.min(
                            player.maxHp,
                            player.hp + 14
                        );

                }


                /* CROW POISON */

                if (b.poison) {

                    e.hp -= 5;

                }


                /* EMPURRÃO SHELLY */

                if (
                    b.superType === 'shelly'
                ) {

                    pushEnemy(
                        e,
                        player.x,
                        player.y,
                        12
                    );

                }


                /* CROW SUPER */

                if (
                    b.superType === 'crow'
                ) {

                    e.hp -= 8;

                }


                if (e.hp <= 0) {

                    if (e.isBoss) {

                        activeBoss = null;

                        bossBanner.classList.add(
                            'hidden'
                        );

                        bossesKilled++;

                        score += 1000;

                        spawnPowerUp(
                            e.x,
                            e.y
                        );

                        screenShake = 25;

                    } else {

                        score += 100;

                    }

                    kills++;

                    enemies.splice(
                        eIdx,
                        1
                    );

                    hudScore.innerText =
                        score;

                    hudKills.innerText =
                        kills;

                    break;

                }

            }

        }

    }


    /* BOSS */

    if (activeBoss) {

        bossHpFill.style.width =
            (
                activeBoss.hp /
                activeBoss.maxHp *
                100
            ) + '%';

    }


    /* SPIKE AREAS */

    for (let i = spikeAreas.length - 1; i >= 0; i--) {

        spikeAreas[i].time--;

        if (spikeAreas[i].time <= 0) {
            spikeAreas.splice(i,1);
        }

    }


    /* FOGO DO BROCK */

    updateFireZones();


    /* BOMBAS PIPER */

    for (let i = bombs.length - 1; i >= 0; i--) {

        const bomb = bombs[i];

        bomb.timer--;

        if (bomb.timer <= 0) {

            createExplosion(
                bomb.x,
                bomb.y,
                75,
                100
            );

            bombs.splice(i,1);

        }

    }


    /* POWER UPS */

    for (let i = powerUps.length - 1; i >= 0; i--) {

        const p = powerUps[i];

        const dist =
            Math.hypot(
                player.x - p.x,
                player.y - p.y
            );

        if (
            dist <
            player.radius + p.radius
        ) {

            playSound('powerup');

            if (p.type === 'heal') {

                player.hp =
                    Math.min(
                        player.maxHp,
                        player.hp + 50
                    );

            } else {

                player.activePowers[p.type] = 360;

            }

            powerUps.splice(i,1);

        }

    }


    updateParticles();

    render();

    requestAnimationFrame(update);
}


/* =========================
   PARTÍCULAS
========================= */

function updateParticles() {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.life--;

        if (p.type === 'explosion') {

            p.radius +=
                (p.maxRadius - p.radius) * .18;

        }

        if (p.type === 'heal') {

            p.radius +=
                (p.maxRadius - p.radius) * .12;

        }

        if (p.type === 'crowRing') {

            p.radius +=
                (p.maxRadius - p.radius) * .2;

        }

        if (
            p.type === 'spikeBurst' ||
            p.type === 'bullImpact'
        ) {

            p.radius +=
                (p.maxRadius - p.radius) * .2;

        }

        if (p.life <= 0) {

            particles.splice(i,1);

        }

    }

}

            'parasol'
        );

    }

    else if (id === 'mortis') {

        ctx.fillStyle = '#581c87';
        ctx.fillRect(-17,-2,34,25);

        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(0,-12,12,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-16,-24,32,6);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-4,-1,8,11);

        ctx.save();
        ctx.rotate(angle);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(14,2);
        ctx.lineTo(37,18);
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(37,18,5,0,Math.PI*2);
        ctx.fill();
        ctx.restore();

    }

    else if (id === 'spike') {

        ctx.fillStyle = '#16a34a';

        ctx.beginPath();
        ctx.arc(0,0,20,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#a855f7';
        ctx.fillRect(-14,8,28,13);

        ctx.fillStyle = '#92400e';
        ctx.fillRect(-17,-2,34,14);

        ctx.fillStyle = '#ef4444';

        ctx.beginPath();
        ctx.arc(-5,-18,5,0,Math.PI*2);
        ctx.arc(5,-20,5,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#86efac';

        for (let i = 0; i < 6; i++) {

            const a =
                Math.PI * 2 * i / 6;

            ctx.beginPath();

            ctx.moveTo(
                Math.cos(a) * 14,
                Math.sin(a) * 14
            );

            ctx.lineTo(
                Math.cos(a) * 21,
                Math.sin(a) * 21
            );

            ctx.strokeStyle = '#86efac';
            ctx.lineWidth = 3;
            ctx.stroke();

        }

    }

    else if (id === 'crow') {

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-16,-2,32,25);

        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(0,-13,13,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(10,-13);
        ctx.lineTo(23,-8);
        ctx.lineTo(10,-4);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.rotate(angle);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(15,2);
        ctx.lineTo(35,12);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(15,8);
        ctx.lineTo(34,0);
        ctx.stroke();
        ctx.restore();

    }

    ctx.restore();

}


/*
   A mira acompanha o mouse, mas o corpo continua parado.
*/
function drawAimedGun(ctx, angle, color, length, height, type) {

    ctx.save();
    ctx.rotate(angle);
    drawGun(ctx, color, length, height, type);
    ctx.restore();
}


function drawGun(ctx, color, length, height, type) {

    ctx.fillStyle = color;

    if (type === 'double') {

        ctx.fillRect(
            8,
            -height,
            length,
            height
        );

        ctx.fillRect(
            8,
            2,
            length,
            height
        );

        ctx.fillStyle = '#0f172a';

        ctx.fillRect(
            5,
            -height - 2,
            12,
            height + 4
        );

        return;
    }

    ctx.fillRect(
        8,
        -height / 2,
        length,
        height
    );

    if (
        type === 'shotgun' ||
        type === 'rocketLauncher'
    ) {

        ctx.fillStyle =
            type === 'rocketLauncher'
                ? '#1e40af'
                : '#475569';

        ctx.fillRect(
            length - 3,
            -height / 2 - 3,
            9,
            height + 6
        );

    }

    if (type === 'rocketLauncher') {

        ctx.fillStyle = '#0f172a';

        ctx.fillRect(
            8,
            height,
            18,
            8
        );

    }

    if (type === 'parasol') {

        ctx.fillStyle = '#2563eb';

        ctx.beginPath();

        ctx.arc(
            length + 2,
            -height,
            12,
            Math.PI,
            Math.PI * 2
        );

        ctx.fill();

    }

}


function render() {

    ctx.save();


    if (screenShake > 0) {

        ctx.translate(
            (Math.random()-.5) * screenShake,
            (Math.random()-.5) * screenShake
        );

        screenShake *= .9;

    }


    /* GRAMA */

    ctx.fillStyle = '#15803d';

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* MOSAICO */

    ctx.fillStyle = '#16a34a';

    for (
        let x = 0;
        x < canvas.width;
        x += 60
    ) {

        for (
            let y = 0;
            y < canvas.height;
            y += 60
        ) {

            if ((x+y)%120===0) {

                ctx.fillRect(
                    x,
                    y,
                    60,
                    60
                );

            }

        }

    }


    /* SPIKE */

    spikeAreas.forEach(area => {

        ctx.fillStyle =
            'rgba(34,197,94,.28)';

        ctx.beginPath();

        ctx.arc(
            area.x,
            area.y,
            area.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle =
            '#22c55e';

        ctx.lineWidth = 4;

        ctx.stroke();


        for (let i = 0; i < 12; i++) {

            const a =
                Math.PI * 2 * i / 12;

            ctx.fillStyle = '#86efac';

            ctx.beginPath();

            ctx.moveTo(
                area.x + Math.cos(a) * 25,
                area.y + Math.sin(a) * 25
            );

            ctx.lineTo(
                area.x + Math.cos(a) * 40,
                area.y + Math.sin(a) * 40
            );

            ctx.lineTo(
                area.x + Math.cos(a + .15) * 25,
                area.y + Math.sin(a + .15) * 25
            );

            ctx.fill();

        }

    });


    /* OBSTÁCULOS */

    obstacles.forEach(o => {

        ctx.fillStyle = '#166534';

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

        ctx.strokeStyle = '#14532d';

        ctx.lineWidth = 4;

        ctx.strokeRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

        ctx.fillStyle = '#22c55e';

        ctx.fillRect(
            o.x + 5,
            o.y + 5,
            o.w - 10,
            6
        );

    });


    /* FOGO NO CHÃO - BROCK */

    fireZones.forEach(fire => {

        const alpha =
            Math.max(
                .15,
                fire.time / fire.maxTime
            );

        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.fillStyle = '#ef4444';

        ctx.beginPath();

        ctx.ellipse(
            fire.x,
            fire.y,
            fire.radius,
            fire.radius * .72,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = '#f97316';

        ctx.beginPath();

        ctx.ellipse(
            fire.x,
            fire.y - 4,
            fire.radius * .72,
            fire.radius * .52,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = '#facc15';

        for (let i = 0; i < 7; i++) {

            const a =
                (Math.PI * 2 * i / 7) +
                performance.now() / 500;

            const fx =
                fire.x +
                Math.cos(a) *
                (12 + (i % 3) * 8);

            const fy =
                fire.y +
                Math.sin(a) *
                (10 + (i % 2) * 7);

            ctx.beginPath();

            ctx.moveTo(fx, fy + 10);

            ctx.lineTo(fx - 5, fy);

            ctx.lineTo(fx, fy - 13);

            ctx.lineTo(fx + 5, fy);

            ctx.closePath();

            ctx.fill();

        }

        ctx.restore();

    });


    /* BOMBAS */

    bombs.forEach(bomb => {

        ctx.fillStyle = '#ef4444';

        ctx.beginPath();

        ctx.arc(
            bomb.x,
            bomb.y,
            bomb.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = '#facc15';

        ctx.lineWidth = 3;

        ctx.stroke();

        ctx.fillStyle = 'white';

        ctx.font = 'bold 12px Arial';

        ctx.textAlign = 'center';

        ctx.fillText(
            Math.ceil(bomb.timer / 60),
            bomb.x,
            bomb.y + 4
        );

    });


    /* POWER UPS */

    powerUps.forEach(p => {

        ctx.fillStyle = '#facc15';

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.font = '16px sans-serif';

        ctx.textAlign = 'center';

        ctx.textBaseline = 'middle';

        ctx.fillText(
            p.icon,
            p.x,
            p.y
        );

    });


    /* TIROS */

    bullets.forEach(b => {

        ctx.save();

        if (b.type === 'brockRocket') {

            ctx.translate(b.x, b.y);

            ctx.rotate(
                b.rocketAngle ||
                Math.atan2(b.vy, b.vx)
            );

            ctx.fillStyle = '#1d4ed8';

            ctx.fillRect(
                -20,
                -10,
                38,
                20
            );

            ctx.fillStyle = '#93c5fd';

            ctx.fillRect(
                -6,
                -7,
                18,
                14
            );

            ctx.fillStyle = '#ef4444';

            ctx.beginPath();

            ctx.moveTo(
                18,
                -10
            );

            ctx.lineTo(
                30,
                0
            );

            ctx.lineTo(
                18,
                10
            );

            ctx.closePath();

            ctx.fill();

            ctx.fillStyle = '#f97316';

            ctx.beginPath();

            ctx.moveTo(
                -20,
                -7
            );

            ctx.lineTo(
                -34,
                0
            );

            ctx.lineTo(
                -20,
                7
            );

            ctx.closePath();

            ctx.fill();

            ctx.restore();

            return;

        }

        if (b.type === 'spikeCactus') {

            ctx.translate(
                b.x,
                b.y
            );

            ctx.rotate(
                b.cactusAngle ||
                Math.atan2(b.vy, b.vx)
            );

            ctx.fillStyle = '#16a34a';

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                13,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = '#86efac';

            ctx.beginPath();

            ctx.arc(
                -5,
                -5,
                3,
                0,
                Math.PI * 2
            );

            ctx.arc(
                4,
                4,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.strokeStyle = '#14532d';

            ctx.lineWidth = 2;

            ctx.stroke();

            ctx.restore();

            return;

        }

        if (b.type === 'spikeThorn') {

            ctx.translate(
                b.x,
                b.y
            );

            ctx.rotate(
                Math.atan2(
                    b.vy,
                    b.vx
                )
            );

            ctx.fillStyle = '#bbf7d0';

            ctx.beginPath();

            ctx.moveTo(
                9,
                0
            );

            ctx.lineTo(
                -6,
                -5
            );

            ctx.lineTo(
                -3,
                0
            );

            ctx.lineTo(
                -6,
                5
            );

            ctx.closePath();

            ctx.fill();

            ctx.restore();

            return;

        }

        ctx.fillStyle = b.color;

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = 'white';

        ctx.lineWidth = 1.5;

        ctx.stroke();

        ctx.restore();

    });


    /* PARTÍCULAS */

    particles.forEach(p => {

        if (p.type === 'explosion') {

            ctx.strokeStyle =
                `rgba(251,146,60,${p.life / p.maxLife})`;

            ctx.lineWidth = 7;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI * 2
            );

            ctx.stroke();

        }


        if (p.type === 'heal') {

            ctx.strokeStyle =
                `rgba(34,197,94,${p.life / p.maxLife})`;

            ctx.lineWidth = 6;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI * 2
            );

            ctx.stroke();

        }


        if (p.type === 'crowRing') {

            ctx.strokeStyle =
                `rgba(168,85,247,${p.life / p.maxLife})`;

            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI * 2
            );

            ctx.stroke();

        }

        if (p.type === 'spikeBurst') {

            ctx.strokeStyle =
                `rgba(134,239,172,${p.life / p.maxLife})`;

            ctx.lineWidth = 6;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI * 2
            );

            ctx.stroke();

        }

        if (p.type === 'bullImpact') {

            ctx.strokeStyle =
                `rgba(251,146,60,${p.life / p.maxLife})`;

            ctx.lineWidth = 10;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI * 2
            );

            ctx.stroke();

        }

        if (p.type === 'muzzle') {

            ctx.fillStyle =
                `rgba(250,204,21,${p.life / p.maxLife})`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                12,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    });


    /* INIMIGOS */

    enemies.forEach(e => {

        ctx.fillStyle =
            e.isBoss
                ? '#7e22ce'
                : e.type === 'tank'
                    ? '#b91c1c'
                    : '#dc2626';

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle =
            e.isBoss
                ? '#facc15'
                : '#0f172a';

        ctx.lineWidth = 3;

        ctx.stroke();


        /* VIDA */

        ctx.fillStyle =
            'rgba(0,0,0,.8)';

        ctx.fillRect(
            e.x - 18,
            e.y - e.radius - 10,
            36,
            5
        );

        ctx.fillStyle =
            '#ef4444';

        ctx.fillRect(
            e.x - 17,
            e.y - e.radius - 9,
            Math.max(
                0,
                (e.hp / e.maxHp) * 34
            ),
            3
        );

    });


    /* PLAYER */

    const angle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    /* ESCUDO */

    if (player.activePowers.shield) {

        ctx.strokeStyle = '#38bdf8';

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            player.radius + 8,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    /* PERSONAGEM */

    drawBrawler(
        ctx,
        selectedBrawler.id,
        angle
    );

    /* MIRA: mexe, enquanto o corpo permanece fixo */
    ctx.save();
    ctx.translate(
        Math.cos(angle) * 34,
        Math.sin(angle) * 34
    );
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,0,7,0,Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-11,0);
    ctx.lineTo(-5,0);
    ctx.moveTo(5,0);
    ctx.lineTo(11,0);
    ctx.moveTo(0,-11);
    ctx.lineTo(0,-5);
    ctx.moveTo(0,5);
    ctx.lineTo(0,11);
    ctx.stroke();
    ctx.restore();

    ctx.restore();


    /* VIDA */

    ctx.fillStyle = '#111';

    ctx.fillRect(
        player.x - 25,
        player.y - 35,
        50,
        6
    );

    ctx.fillStyle = '#22c55e';

    ctx.fillRect(
        player.x - 24,
        player.y - 34,
        48 * (player.hp / player.maxHp),
        4
    );


    ctx.restore();

}


/* =========================
   HUD
========================= */

function updateAmmoHUD() {

    for (let i = 1; i <= 3; i++) {

        document.getElementById(
            `ammo-${i}`
        ).style.width =
            i <= player.ammo
                ? '100%'
                : '0%';

    }

}


function updateSuperHUD() {

    superFill.style.width =
        player.superCharge + '%';

    superText.innerText =
        `CARREGANDO SUPER: ${
            Math.floor(player.superCharge)
        }%`;

}


/* =========================
   COMEÇAR
========================= */

function startGame() {

    startScreen.classList.add('hidden');

    brawlerScreen.classList.add('hidden');

    gameoverScreen.classList.add('hidden');

    gameRunning = true;

    score = 0;
    kills = 0;
    bossesKilled = 0;

    player.x = 480;
    player.y = 320;

    superAiming = false;
    superPointerId = null;
    mobileMove.x = 0;
    mobileMove.y = 0;
    joystickActive = false;
    joystickPointerId = null;
    joystickKnob.style.left = '50%';
    joystickKnob.style.top = '50%';
    superTouch.classList.remove('aiming');
    hideSuperAimPreview();
    superAimPoint.x = player.x;
    superAimPoint.y = player.y;

    player.hp =
        selectedBrawler.hp;

    player.maxHp =
        selectedBrawler.hp;

    player.superCharge = 0;

    player.ammo = 3;

    player.ammoRecharge = 0;

    player.activePowers = {};

    player.dash = null;
    player.jump = null;

    bullets = [];
    enemies = [];
    powerUps = [];
    particles = [];
    spikeAreas = [];
    bombs = [];
    fireZones = [];

    activeBoss = null;

    createObstacles();

    bossBanner.classList.add('hidden');

    hudScore.innerText = '0';
    hudKills.innerText = '0';

    document.getElementById('hud-avatar').innerText =
        selectedBrawler.icon;

    document.getElementById('hud-brawler-name').innerText =
        selectedBrawler.name;

    updateAmmoHUD();
    updateSuperHUD();

    update();

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    if (!gameRunning) return;

    gameRunning = false;

    document.getElementById('final-score').innerText =
        score;

    document.getElementById('final-kills').innerText =
        kills;

    document.getElementById('final-bosses').innerText =
        bossesKilled;

    gameoverScreen.classList.remove('hidden');

}


/* =========================
   MENU
========================= */

function showMenu() {

    gameRunning = false;

    gameoverScreen.classList.add('hidden');

    brawlerScreen.classList.add('hidden');

    startScreen.classList.remove('hidden');

}


/* =========================
   INICIALIZAÇÃO
========================= */

createObstacles();

renderBrawlerGrid();

updateBrawlerInfo();

updateAmmoHUD();

updateSuperHUD();

render();

</script>
